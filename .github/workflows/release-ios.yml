# iOS release build for JoyoFit on a GitHub macOS runner: the same script as the MacBook build
# (scripts/ios/mac-build.sh: expo prebuild, pods, xcodebuild archive + export, IPA checks), so there is
# one way to build on a Mac.
#
# Manual only (Actions tab -> "Release iOS" -> Run workflow). The job is bound to the `release`
# environment (owner approval, default branch only), which holds the App Store Connect API key.
# Setup: docs/ci-release.md.
#
# Signing: the archive is signed automatically through the API key (xcodebuild -allowProvisioningUpdates);
# the export is manual with the Apple Distribution identity from the IOS_DIST_CERT_* secrets and an App Store
# profile fetched through the API (scripts/ios/asc-ci-profile.py), the same split as scripts/build-ios-mac.sh.
#
# BUILD_NUMBER is left to the script: YYYYMMDDHHMM in UTC, as scripts/build-ios-linux.sh, so CI and
# local builds never collide. Nothing is uploaded unless `upload_testflight` is ticked.
name: Release iOS

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the IPA to App Store Connect (TestFlight, internal testing only)"
        type: boolean
        default: false
      xcode_version:
        description: "Xcode version (semver range for maxim-lobanov/setup-xcode, e.g. 26.x or latest-stable)"
        type: string
        default: latest-stable
  # To also build on version tags, uncomment. The `release` environment approval still applies.
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    environment: release
    env:
      UPLOAD: ${{ inputs.upload_testflight && '1' || '0' }}
      XCODE_VERSION: ${{ inputs.xcode_version || 'latest-stable' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun and CocoaPods downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/CocoaPods
          key: ios-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: ios-${{ runner.os }}-

      # altool and the script read the key from ~/.appstoreconnect/private_keys (mode 600).
      - name: Install App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Export signs manually: automatic export needs a cloud-managed distribution certificate, which the API key
      # may not create ("Cloud signing permission error", see docs/ios-mac.md). So the Apple Distribution identity
      # comes from a .p12 in a temporary keychain and the App Store profile from the API (asc-ci-profile.py).
      - name: Import distribution certificate and fetch the App Store profiles
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          kcpass="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$kc" | sed 's/^ *[0-9]*) [0-9A-F]* //'
          serial="$(security find-certificate -a -c 'Apple Distribution' -p "$kc" | openssl x509 -noout -serial | cut -d= -f2 | head -1)"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          out="$(python3 scripts/ios/asc-ci-profile.py com.joyodigitama.joyofit "$serial" "$RUNNER_TEMP/store.mobileprovision" \
            aps-environment com.apple.developer.healthkit com.apple.developer.applesignin)"
          uuid="$(cut -f1 <<<"$out")"
          cp "$RUNNER_TEMP/store.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
          echo "EXPORT_PROFILE=$(cut -f2 <<<"$out")" >> "$GITHUB_ENV"
          # The rest-timer Live Activity extension (targets/rest-timer) has its own bundle id and profile; it needs no
          # capability, and asc-ci-profile.py registers the bundle id when it is missing.
          out="$(python3 scripts/ios/asc-ci-profile.py com.joyodigitama.joyofit.resttimer "$serial" "$RUNNER_TEMP/widget.mobileprovision")"
          uuid="$(cut -f1 <<<"$out")"
          cp "$RUNNER_TEMP/widget.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
          echo "EXPORT_WIDGET_PROFILE=$(cut -f2 <<<"$out")" >> "$GITHUB_ENV"

      - name: Build IPA
        run: |
          if [ "$UPLOAD" = 1 ]; then
            scripts/ios/mac-build.sh --upload
          else
            scripts/ios/mac-build.sh
          fi

      - name: Checksum
        run: shasum -a 256 build/ios-mac/JoyoFit.ipa | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joyofit-ios-${{ github.run_number }}
          path: build/ios-mac/JoyoFit.ipa
          if-no-files-found: error
          retention-days: 30

      # Symbols for the crash logs TestFlight collects (uploadSymbols is on in the export, so App Store Connect has them
      # too): kept to symbolicate by hand a crash report that came back with bare addresses.
      - name: Upload dSYMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joyofit-ios-dsyms-${{ github.run_number }}
          path: build/ios-mac/JoyoFit.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 30

      # The logs hold signing and Pods output but no secrets (the key is only passed as a path).
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joyofit-ios-logs-${{ github.run_number }}
          path: build/ios-mac/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: |
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
