# Checks for pull requests and pushes to master. No secrets, read-only token, so it is safe for forks.
# Same commands as on the laptop (docs/ios.md "Commands", package.json scripts).
#
# Not in CI on purpose:
#   - `expo lint`: fails locally today (react-hooks/set-state-in-effect in two files).
#   - the iPhoneOS SDK type-check (needs the Xcode SDK) and the iOS ninja build; run those on the Mac/Linux box.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (types, tests, API coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/hwt/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun scripts/i18n-check.ts
      - run: bunx tsrs --noEmit
      - run: bun test ./src/
      - run: node modules/huawei-wear/ios/scripts/check-api.mjs
      - name: "@joyofit/hwt"
        working-directory: packages/hwt
        run: |
          bun install --frozen-lockfile
          bun test
          bunx tsrs --noEmit -p tsconfig.json
      # The HW_AGNSS encoder shared by scripts/agps-rtcm.ts and the Worker; the server job type-checks it through server/src/agps.ts.
      - name: "@joyofit/agps-rtcm"
        working-directory: packages/agps-rtcm
        run: bun test

  server:
    name: Server (tsrs, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'server/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # The ride relay imports the wire protocol from ../src/features/ride; esbuild reads the root tsconfig (extends expo) for those files.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bunx tsrs --noEmit
      - run: bunx vitest run

  site:
    name: Site (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # site/tsconfig.json extends expo/tsconfig.base from the root node_modules.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test scripts

  kotlin:
    name: Kotlin (unit tests, NewApi lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # CVE-2026-91403: eight eMudhra intermediates were compromised (forged TLS certificates for any host). The JDK that
      # setup-java installs may predate the OpenJDK fix, and Gradle fetches dependencies over TLS, so the JVMs here use a
      # copy of the JDK's cacerts without the emSign hierarchy (the runner's cacerts itself is read-only). Drop this step
      # once the pinned JDK is a fixed release.
      - name: Distrust eMudhra in the JDK (CVE-2026-91403)
        run: |
          store="$RUNNER_TEMP/cacerts"
          cp -L "$JAVA_HOME/lib/security/cacerts" "$store" && chmod 600 "$store"
          for alias in $("$JAVA_HOME/bin/keytool" -list -keystore "$store" -storepass changeit | grep -i emsign | cut -d, -f1); do
            "$JAVA_HOME/bin/keytool" -delete -keystore "$store" -storepass changeit -alias "$alias"
          done
          if "$JAVA_HOME/bin/keytool" -list -keystore "$store" -storepass changeit | grep -qi emsign; then echo "emSign still trusted" >&2; exit 1; fi
          echo "JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=$store -Djavax.net.ssl.trustStorePassword=changeit" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: bun install --frozen-lockfile
      # android/ is generated (gitignored); the module tests need the Gradle project.
      - run: bunx expo prebuild -p android --no-install
      - run: ./gradlew :huawei-wear:testDebugUnitTest :ble-sensors:testDebugUnitTest :replay-encoder:testDebugUnitTest
        working-directory: android
      # NewApi only (modules/newapi-lint.gradle): a call newer than minSdk 29 outside a Build.VERSION.SDK_INT check
      # compiles and then throws NoSuchMethodError on an older phone. Findings print to the log.
      - run: ./gradlew :huawei-wear:lintDebug :ble-sensors:lintDebug :replay-encoder:lintDebug
        working-directory: android

  swift-protocol:
    name: Swift tests (HuaweiProtocol)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests need Swift 6.4 (6.1 rejects HealthExporterTests); swift-actions/setup-swift stops at 6.2, so the
      # official toolchain tarball is used and cached.
      - name: Cache Swift toolchain
        id: swift-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/swift-toolchain
          key: swift-6.4.1-ubuntu24.04
      - name: Install Swift 6.4.1
        run: |
          if [ ! -x ~/swift-toolchain/usr/bin/swift ]; then
            mkdir -p ~/swift-toolchain
            curl -fsSL https://download.swift.org/swift-6.4.1-release/ubuntu2404/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04.tar.gz \
              | tar -xz --strip-components=1 -C ~/swift-toolchain
          fi
          echo "$HOME/swift-toolchain/usr/bin" >> "$GITHUB_PATH"
          ~/swift-toolchain/usr/bin/swift --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/huawei-wear/ios/HuaweiProtocol/.build
          key: swiftpm-protocol-${{ runner.os }}-${{ hashFiles('modules/huawei-wear/ios/HuaweiProtocol/Package.swift') }}
      - run: swift test
        working-directory: modules/huawei-wear/ios/HuaweiProtocol

  swift-logic:
    name: Swift tests (ModuleLogicTests, inert shapes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The tests need Swift 6.4 (6.1 rejects HealthExporterTests); swift-actions/setup-swift stops at 6.2, so the
      # official toolchain tarball is used and cached.
      - name: Cache Swift toolchain
        id: swift-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/swift-toolchain
          key: swift-6.4.1-ubuntu24.04
      - name: Install Swift 6.4.1
        run: |
          if [ ! -x ~/swift-toolchain/usr/bin/swift ]; then
            mkdir -p ~/swift-toolchain
            curl -fsSL https://download.swift.org/swift-6.4.1-release/ubuntu2404/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04.tar.gz \
              | tar -xz --strip-components=1 -C ~/swift-toolchain
          fi
          echo "$HOME/swift-toolchain/usr/bin" >> "$GITHUB_PATH"
          ~/swift-toolchain/usr/bin/swift --version
      - run: sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/huawei-wear/ios/ModuleLogicTests/.build
          key: swiftpm-logic-${{ runner.os }}-${{ hashFiles('modules/huawei-wear/ios/ModuleLogicTests/Package.swift') }}
      # One run: the shape-dump tests write JSON when INERT_SHAPES_OUT is set (no-ops otherwise).
      - name: Logic tests
        working-directory: modules/huawei-wear/ios/ModuleLogicTests
        env:
          JOYOFIT_REPO_ROOT: ${{ github.workspace }}
          INERT_SHAPES_OUT: ${{ runner.temp }}/shapes.json
        run: |
          ./link-sources.sh
          swift test
      # The JS shapes the iOS module returns must type-check against the TypeScript declarations
      # in modules/huawei-wear/src.
      - run: bun install --frozen-lockfile
      - name: Inert shapes vs TypeScript declarations
        run: node modules/huawei-wear/ios/ModuleLogicTests/check-inert-shapes.mjs "$RUNNER_TEMP/shapes.json"
      # The sensor module's pure logic (GATT plan table, reconnect backoff); the CoreBluetooth and CoreLocation files cannot build on Linux.
      - name: Sensor logic tests (ble-sensors)
        working-directory: modules/ble-sensors/ios/SensorLogicTests
        run: swift test
      # The replay encoder's pure logic (config, frame timing, fit rectangles); the AVFoundation and ImageIO files cannot build on Linux.
      - name: Encoder logic tests (replay-encoder)
        working-directory: modules/replay-encoder/ios/EncoderLogicTests
        run: swift test
