# JoyoNavi watch app (watch-app/navi, docs/watch-app.md "Building in CI"): a signed .hap built on GitHub's runners, so no
# machine needs Huawei's Command Line Tools installed.
#
# - Runs on pushes to master and pull requests that touch watch-app/navi/, and by hand (Actions → Watch app → Run workflow;
#   input `mode`, debug or release). The signed .hap is the run's artifact `joyonavi-<mode>-<rev>`.
# - Huawei's Command Line Tools for HarmonyOS 6.0.1.251 (linux-x64) may not be redistributed, so they are not downloaded
#   from Huawei here: a trimmed copy (no native/ or previewer/ contents, which the lite build never reads) sits in the private
#   R2 bucket joyofit-ci-tools and is served by the joyofit-ci-tools Worker (tools/ci-tools-worker/) to holders of
#   CI_TOOLS_KEY. The archive's SHA-256 is pinned below.
# - Secrets live in the `watch` environment: CI_TOOLS_KEY (same value as the Worker secret), and the signing files from
#   ~/.config/joyofit/joyonavi-signing as base64: JOYONAVI_P12_BASE64, JOYONAVI_KEYSTORE_PASSWORD_BASE64,
#   JOYONAVI_DEBUG_CER_BASE64, JOYONAVI_DEBUG_P7B_BASE64 and, once AppGallery issues them, JOYONAVI_RELEASE_CER_BASE64 and
#   JOYONAVI_RELEASE_P7B_BASE64. Pull requests from forks get no secrets and skip the build.
# - Artifacts of a public repo can be downloaded by any signed-in GitHub user. A debug .hap only installs on the watches
#   listed in its profile.
name: Watch app

on:
  push:
    branches: [master]
    paths:
      - "watch-app/navi/**"
      - ".github/workflows/watch-app.yml"
  pull_request:
    paths:
      - "watch-app/navi/**"
      - ".github/workflows/watch-app.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

env:
  CI_TOOLS_URL: https://joyofit-ci-tools.dzulfikar-at.workers.dev
  HMOS_CLT_OBJECT: hmos-clt/6.0.1.251-linux-x64-lite.tar.zst
  HMOS_CLT_SHA256: 79616815afdd031d84ca739f7f69946415cd515f167e4fb606309b403ab17f30

concurrency:
  group: watch-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Signed .hap (${{ inputs.mode || 'debug' }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: watch
    env:
      MODE: ${{ inputs.mode || 'debug' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Command Line Tools for HarmonyOS (from the private bucket)
        env:
          CI_TOOLS_KEY: ${{ secrets.CI_TOOLS_KEY }}
        run: |
          curl -fsS --retry 3 -H "Authorization: Bearer $CI_TOOLS_KEY" -o "$RUNNER_TEMP/clt.tar.zst" "$CI_TOOLS_URL/$HMOS_CLT_OBJECT"
          echo "$HMOS_CLT_SHA256  $RUNNER_TEMP/clt.tar.zst" | sha256sum -c -
          zstd -q -d --long=27 -c "$RUNNER_TEMP/clt.tar.zst" | tar -x -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/clt.tar.zst"
          echo "HMOS_CLT=$RUNNER_TEMP/command-line-tools" >> "$GITHUB_ENV"
          head -3 "$RUNNER_TEMP/command-line-tools/version.txt"
      - name: Signing files
        env:
          P12: ${{ secrets.JOYONAVI_P12_BASE64 }}
          PASSWORD: ${{ secrets.JOYONAVI_KEYSTORE_PASSWORD_BASE64 }}
          DEBUG_CER: ${{ secrets.JOYONAVI_DEBUG_CER_BASE64 }}
          DEBUG_P7B: ${{ secrets.JOYONAVI_DEBUG_P7B_BASE64 }}
          RELEASE_CER: ${{ secrets.JOYONAVI_RELEASE_CER_BASE64 }}
          RELEASE_P7B: ${{ secrets.JOYONAVI_RELEASE_P7B_BASE64 }}
        run: |
          K="$RUNNER_TEMP/joyonavi-signing"
          install -d -m 700 "$K"
          umask 077
          echo "$P12" | base64 -d > "$K/joyonavi.p12"
          echo "$PASSWORD" | base64 -d > "$K/keystore-password"
          if [ "$MODE" = debug ]; then cer=$DEBUG_CER p7b=$DEBUG_P7B; else cer=$RELEASE_CER p7b=$RELEASE_P7B; fi
          if [ -z "$cer" ] || [ -z "$p7b" ]; then
            echo "::error::No $MODE certificate/profile in the watch environment (JOYONAVI_${MODE^^}_CER_BASE64, JOYONAVI_${MODE^^}_P7B_BASE64)"
            exit 1
          fi
          echo "$cer" | base64 -d > "$K/joyonavi-$MODE.cer"
          echo "$p7b" | base64 -d > "$K/joyonavi-$MODE.p7b"
          echo "JOYONAVI_SIGNING=$K" >> "$GITHUB_ENV"
      - name: Build and sign
        id: build
        run: |
          hap=$(watch-app/navi/tools/build-signed.sh "$MODE")
          echo "hap=$hap" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$hap" .hap)" >> "$GITHUB_OUTPUT"
          ls -l "$hap"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.hap }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove the signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/joyonavi-signing"
