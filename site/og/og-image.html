<!doctype html>
<!-- Source of public/og.png (1200×630). Regenerate with `bun run og` in site/. -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-weight: 200 800;
        src: url("../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");
      }
      :root {
        --background: oklch(0.975 0.008 85);
        --foreground: oklch(0.22 0.012 85);
        --muted: oklch(0.5 0.014 85);
        --makan: oklch(0.472 0.087 225);
        --makan-soft: oklch(0.942 0.023 217);
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 64px;
        align-items: center;
        padding: 0 90px 0 80px;
        background: var(--background);
        color: var(--foreground);
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
      .brand img { height: 52px; }
      h1 { margin-top: 44px; font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; }
      p { margin-top: 24px; font-size: 28px; line-height: 1.4; color: var(--muted); max-width: 640px; }
      .url { margin-top: 40px; font-size: 24px; font-weight: 700; color: var(--makan); }
      .stage { position: relative; height: 520px; border-radius: 40px; background: var(--makan-soft); display: grid; place-items: end center; overflow: hidden; }
      .phone { width: 270px; margin-bottom: -150px; padding: 7px; border-radius: 42px; background: oklch(0.22 0.01 85); }
      .phone img { display: block; width: 100%; border-radius: 36px; }
    </style>
  </head>
  <body>
    <div>
      <div class="brand"><img src="../public/brand/logo-mark.svg" alt="" />JoyoFit</div>
      <h1>Jam-mu.<br />Data-mu.<br />HP-mu.</h1>
      <p>Sinkron jam pintar langsung ke HP-mu lewat Bluetooth, tanpa akun tambahan. Open source.</p>
      <div class="url">fit.joyorogo.com</div>
    </div>
    <div class="stage"><div class="phone"><img src="../public/shots/today.webp" alt="" /></div></div>
  </body>
</html>
